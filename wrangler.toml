# ================================================================
# 🚀 wrangler.toml - AJ Sports 2026 Ultimate Edge Worker
# ================================================================

name = "ajsports-edge-worker"
main = "src/worker.js"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 💾 KV Namespace
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[[kv_namespaces]]
binding = "AJCACHE"
id = "207fb4ae03904682a91c7d23f1f064cb"
preview_id = "207fb4ae03904682a91c7d23f1f064cb"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🌐 Environment Variables
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[vars]
RENDER_URL = "https://server.ajsports.ir"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ⏰ Cron Triggers (Keep-Alive هر ۱ دقیقه)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[triggers]
crons = ["*/1 * * * *"]